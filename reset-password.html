<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha - Apasbac</title>
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
</head>
<body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 60px;">Redirecionando...</p>
    <script>
        // O e-mail da API envia o usuário para  <site>/reset-password?token=...
        // Esta página só repassa o token para o formulário "Criar Nova Senha" da página de login.
        (function () {
            var params = new URLSearchParams(window.location.search);
            var token = params.get('token');
            var base = window.location.pathname.replace(/reset-password(\/index\.html|\/)?$/, '');
            var destino = base + 'entrar.html' + (token ? '?token=' + encodeURIComponent(token) : '');
            window.location.replace(destino);
        })();
    </script>
    <noscript>Ative o JavaScript ou acesse a página de <a href="../entrar.html">login</a>.</noscript>
</body>
</html>
