<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Apasbac</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="imagens/Logo.webp" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .admin-nav-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 24px;
            border-radius: var(--radius-pill);
            border: 2px solid var(--primary);
            background: white;
            color: var(--primary);
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .admin-form-box {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            max-width: 650px;
            margin: 0 auto 40px;
        }

        .item-card {
            background: white;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 12px;
        }

        .item-thumb {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }

        .btn-edit {
            background: #d4a017;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-delete {
            background: #c0392b;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-edit:hover,
        .btn-delete:hover {
            filter: brightness(1.1);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-box {
            background: white;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 16px;
            padding: 25px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header class="main-header">
        <div class="header-container">
            <a href="index.html" class="logo-link">
                <img src="imagens/Logo.webp" alt="Logo da Apasbac" class="logo-img">
            </a>
            <h2 style="font-size: 1.1rem; color: var(--primary);"><i class="fa-solid fa-lock"></i> Área Administrativa
            </h2>
            <div class="user-actions" style="margin-left: auto;">
                <span id="user-display" style="font-size: 0.85rem; font-weight: 600; color: var(--text-mid);"></span>
                <a href="#" id="btnLogout" style="background: #5c0f0f;">Sair</a>
            </div>
        </div>
    </header>

  <main class="page-container">
        <div class="faixa-topo" style="border-radius: 12px; margin-bottom: 30px; padding: 40px 20px;">
            <h1>Central de Cadastros</h1>
            <p>Gerencie animais pela API REST e eventos em tempo real.</p>
        </div>

        <!-- ABAS DE NAVEGAÇÃO -->
        <div class="admin-nav-tabs">
            <button class="tab-btn active" id="btnTabAnimal" onclick="mostrarAba('animal')">
                <i class="fa-solid fa-plus"></i> Cadastrar Animal
            </button>
            <button class="tab-btn" id="btnTabListAnimal" onclick="mostrarAba('list-animal')">
                <i class="fa-solid fa-paw"></i> Ver Animais
            </button>
            <button class="tab-btn" id="btnTabEvento" onclick="mostrarAba('evento')">
                <i class="fa-solid fa-plus"></i> Cadastrar Evento
            </button>
            <button class="tab-btn" id="btnTabListEvento" onclick="mostrarAba('list-evento')">
                <i class="fa-solid fa-calendar-days"></i> Ver Eventos
            </button>
        </div>

        <!-- 1. FORMULÁRIO: CADASTRAR ANIMAL -->
        <div id="aba-animal" class="admin-form-box">
            <h2 style="color: var(--primary); margin-bottom: 20px;"><i class="fa-solid fa-dog"></i> Informações do Animal</h2>
            <form id="formAnimal">
                <div class="input-group">
                    <label>Nome do Pet *</label>
                    <input type="text" id="pet_name" placeholder="Ex: Rex, Mel, Pipoca" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="input-group">
                        <label>Sexo *</label>
                        <select id="pet_sex" style="width: 100%; padding: 12px; border-radius: 6px; border: 1.5px solid var(--border);">
                            <option value="MALE">Macho</option>
                            <option value="FEMALE">Fêmea</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Porte *</label>
                        <select id="pet_size" style="width: 100%; padding: 12px; border-radius: 6px; border: 1.5px solid var(--border);">
                            <option value="SMALL">Pequeno</option>
                            <option value="MEDIUM">Médio</option>
                            <option value="LARGE">Grande</option>
                            <option value="EXTRA_LARGE">Porte Gigante</option>
                        </select>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="input-group">
                        <label>Raça *</label>
                        <input type="text" id="pet_breed" placeholder="Ex: Vira-lata, Poodle" required>
                    </div>
                    <div class="input-group">
                        <label>Idade Estimada *</label>
                        <input type="text" id="pet_age" placeholder="Ex: 5 meses, 2 anos" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Link da Foto do Pet (URL)</label>
                    <input type="url" id="pet_photo" placeholder="https://imgur.com/... ou link de imagem">
                </div>
                <div class="input-group">
                    <label>Temperamento *</label>
                    <input type="text" id="pet_temperament" placeholder="Ex: Dócil, Brincalhão, Calmo" required>
                </div>
                <div class="input-group">
                    <label>História / Descrição do Animal</label>
                    <textarea id="pet_description" rows="3" placeholder="Conte sobre o temperamento, resgate ou cuidados..." style="width: 100%; padding: 12px; border-radius: 6px; border: 1.5px solid var(--border);"></textarea>
                </div>
                <div class="input-group">
                    <label>Vacinas já aplicadas *</label>
                    <input type="text" id="pet_vaccines" placeholder="Ex: V10, Antirrábica..." required>
                </div>

                <button type="submit" class="submit-btn-modern" id="btnSalvarAnimal">
                    <i class="fa-solid fa-check"></i> Salvar Animal na API
                </button>
            </form>
        </div>

        <!-- 2. LISTA DE ANIMAIS -->
        <div id="aba-list-animal" class="admin-form-box" style="display: none; max-width: 850px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="color: var(--primary); margin: 0;"><i class="fa-solid fa-paw"></i> Animais Cadastrados</h2>
                <button onclick="carregarListaAnimais()" style="padding: 6px 14px; border-radius: 20px; cursor: pointer;">
                    <i class="fa-solid fa-arrows-rotate"></i> Atualizar
                </button>
            </div>
            <div id="lista-animais-admin"><p>Carregando animais...</p></div>
        </div>

        <!-- 3. FORMULÁRIO: CADASTRAR EVENTO (Com Data Inicial e Término) -->
        <!-- FORMULÁRIO: CADASTRAR EVENTO -->
        <div id="aba-evento" class="admin-form-box" style="display: none;">
            <h2 style="color: var(--primary); margin-bottom: 20px;"><i class="fa-solid fa-bullhorn"></i> Informações do Evento</h2>
            <form id="formEvento">
                <div class="input-group">
                    <label>Título do Evento *</label>
                    <input type="text" id="event_title" placeholder="Ex: Feira de Adoção" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="input-group">
                        <label>Categoria *</label>
                        <select id="event_category" style="width: 100%; padding: 12px; border-radius: 6px; border: 1.5px solid var(--border);">
                            <option value="Feira de Adoção">Feira de Adoção</option>
                            <option value="Campanha de Doação">Campanha de Doação</option>
                            <option value="Mutirão">Mutirão</option>
                            <option value="Conscientização">Conscientização</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Data do Evento *</label>
                        <input type="date" id="event_date" required>
                    </div>
                </div>

                <div class="input-group" style="margin-top: 15px;">
                    <label>Localização / Onde vai ser *</label>
                    <input type="text" id="event_location" placeholder="Ex: Praça Central" required>
                </div>

                <div class="input-group">
                    <label>Link de Imagem (opcional)</label>
                    <input type="url" id="event_image" placeholder="Deixe vazio para usar a logo padrão">
                </div>

                <div class="input-group">
                    <label>Descrição do Evento</label>
                    <textarea id="event_desc" rows="3" placeholder="Explique os detalhes..." style="width: 100%; padding: 12px; border-radius: 6px; border: 1.5px solid var(--border);"></textarea>
                </div>

                <button type="submit" class="submit-btn-modern" id="btnSalvarEvento">
                    <i class="fa-solid fa-check"></i> Publicar Evento
                </button>
            </form>
        </div>

        <!-- 4. LISTA DE EVENTOS -->
        <div id="aba-list-evento" class="admin-form-box" style="display: none; max-width: 850px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="color: var(--primary); margin: 0;"><i class="fa-solid fa-calendar-days"></i> Eventos Cadastrados</h2>
                <button onclick="carregarListaEventos()" style="padding: 6px 14px; border-radius: 20px; cursor: pointer;">
                    <i class="fa-solid fa-arrows-rotate"></i> Atualizar
                </button>
            </div>
            <div id="lista-eventos-admin"><p>Carregando eventos...</p></div>
        </div>
    </main>

    <!-- Clientes de Integração -->
    <script src="script/api-client.js"></script>
    <script src="script/supabase-client.js"></script>

    <script>
        // 1. Verificação de Acesso à prova de falhas
        (async function verificarAdmin() {
            const emailSalvo = (localStorage.getItem('usuario_logado_email') || '').trim().toLowerCase();

            if (emailSalvo === 'apasbac.assis@gmail.com') {
                const userDisp = document.getElementById("user-display");
                if (userDisp) userDisp.innerText = "Admin Oficial (apasbac.assis@gmail.com)";
                return;
            }

            if (!api.isAuthenticated()) {
                alert("Acesso restrito! Faça login com uma conta de administrador ou staff.");
                window.location.href = "entrar.html";
                return;
            }

            try {
                let userMe = null;
                try { userMe = await api.getMe(); } catch (e) { userMe = api.getUser(); }

                const dados = (userMe && userMe.data) ? (userMe.data.user || userMe.data) : (userMe && userMe.user ? userMe.user : (userMe || {}));
                const userEmail = (dados.email || emailSalvo).toLowerCase();
                const userRole = (dados.role || '').toUpperCase();

                const isAdmin = emailSalvo === 'apasbac.assis@gmail.com' || userEmail === 'apasbac.assis@gmail.com' || userRole === 'ADMIN' || userRole === 'STAFF';

                if (!isAdmin) {
                    alert("Acesso negado: Somente administradores podem acessar este painel.");
                    window.location.href = "index.html";
                    return;
                }

                const userDisp = document.getElementById("user-display");
                if (userDisp) userDisp.innerText = `Admin (${emailSalvo})`;
            } catch (err) {
                if (emailSalvo === 'apasbac.assis@gmail.com') return;
                api.clearSession();
                window.location.href = "entrar.html";
            }
        })();

        // Botão de Logout
        document.getElementById('btnLogout')?.addEventListener('click', async (e) => {
            e.preventDefault();
            if (typeof db !== 'undefined') {
                try { await db.auth.signOut(); } catch (err) { }
            }
            api.logout();
        });

        // Alternar Abas
        function mostrarAba(tipo) {
            document.getElementById('aba-animal').style.display = 'none';
            document.getElementById('aba-evento').style.display = 'none';
            document.getElementById('aba-list-animal').style.display = 'none';
            document.getElementById('aba-list-evento').style.display = 'none';

            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            if (tipo === 'animal') {
                document.getElementById('aba-animal').style.display = 'block';
                document.getElementById('btnTabAnimal').classList.add('active');
            } else if (tipo === 'list-animal') {
                document.getElementById('aba-list-animal').style.display = 'block';
                document.getElementById('btnTabListAnimal').classList.add('active');
                carregarListaAnimais();
            } else if (tipo === 'evento') {
                document.getElementById('aba-evento').style.display = 'block';
                document.getElementById('btnTabEvento').classList.add('active');
            } else if (tipo === 'list-evento') {
                document.getElementById('aba-list-evento').style.display = 'block';
                document.getElementById('btnTabListEvento').classList.add('active');
                carregarListaEventos();
            }
        }

        function fecharModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        // Formulário de Animais
        document.getElementById('formAnimal').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSalvarAnimal');
            btn.disabled = true;
            btn.innerText = "Salvando na API...";

            const foto = document.getElementById('pet_photo').value.trim() || 'imagens/Logo.webp';
            const vacinasTexto = document.getElementById('pet_vaccines').value;
            const vacinasArray = vacinasTexto.split(',').map(v => v.trim()).filter(Boolean);

            const payload = {
                name: document.getElementById('pet_name').value.trim(),
                sex: document.getElementById('pet_sex').value,
                size: document.getElementById('pet_size').value,
                breed: document.getElementById('pet_breed').value.trim(),
                temperament: document.getElementById('pet_temperament').value.trim(),
                vaccines: vacinasArray,
                description: `Idade: ${document.getElementById('pet_age').value.trim()} | Foto URL: ${foto} | ` + document.getElementById('pet_description').value.trim(),
                escapeTendency: false
            };

            try {
                await api.createAnimal(payload);
                alert("Animal cadastrado com sucesso na API!");
                document.getElementById('formAnimal').reset();
                mostrarAba('list-animal');
            } catch (err) {
                alert("Erro ao cadastrar animal: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Salvar Animal na API';
            }
        });

        // Listar Animais
        let animaisCache = [];
        async function carregarListaAnimais() {
            const container = document.getElementById('lista-animais-admin');
            container.innerHTML = '<p><i class="fa-solid fa-spinner fa-spin"></i> Carregando animais...</p>';

            try {
                const res = await api.getAnimals({ limit: 100 });
                let lista = [];
                if (Array.isArray(res)) lista = res;
                else if (res?.data && Array.isArray(res.data)) lista = res.data;
                else if (res?.data?.data && Array.isArray(res.data.data)) lista = res.data.data;

                animaisCache = lista;

                if (!animaisCache || animaisCache.length === 0) {
                    container.innerHTML = '<p style="color:#888;">Nenhum animal cadastrado ainda.</p>';
                    return;
                }

                container.innerHTML = '';
                animaisCache.forEach(pet => {
                    const petId = pet.id;
                    const foto = (pet.photos && pet.photos[0]) || pet.imageUrl || 'imagens/Logo.webp';

                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.innerHTML = `
                        <div style="display: flex; align-items: center; gap: 14px;">
                            <img src="${foto}" class="item-thumb" alt="${pet.name}" onerror="this.src='imagens/Logo.webp'">
                            <div>
                                <h4 style="margin: 0; color: var(--primary);">${pet.name || 'Sem nome'}</h4>
                                <p style="margin: 2px 0; font-size: 0.85rem; color: #555;">
                                    ${pet.breed || 'SRD'} • ${pet.sex === 'MALE' ? 'Macho' : 'Fêmea'} • ID: ${pet.id}
                                </p>
                            </div>
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <button class="btn-delete" onclick="excluirAnimal(${petId}, '${pet.name}')">
                                <i class="fa-solid fa-trash"></i> Excluir
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = `<p style="color: #c0392b;">Erro ao carregar: ${err.message}</p>`;
            }
        }

        async function excluirAnimal(id, nome) {
            if (!confirm(`Deseja realmente excluir o animal "${nome}"?`)) return;
            try {
                await api.deleteAnimal(id);
                alert("Animal removido com sucesso!");
                carregarListaAnimais();
            } catch (err) {
                alert("Erro ao excluir: " + err.message);
            }
        }

    document.getElementById('formEvento').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSalvarEvento');
            btn.disabled = true;
            btn.innerText = "Publicando...";

            let { data: { session } } = await db.auth.getSession();
            if (!session) {
                const senhaSupabase = prompt("Digite a senha do Supabase para autorizar a publicação:");
                if (!senhaSupabase) {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Publicar Evento';
                    return;
                }
                const { data: loginData, error: loginErr } = await db.auth.signInWithPassword({
                    email: 'apasbac.assis@gmail.com',
                    password: senhaSupabase
                });
                if (loginErr) {
                    alert("Erro de senha do Supabase: " + loginErr.message);
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Publicar Evento';
                    return;
                }
                session = loginData.session;
            }

            const foto = document.getElementById('event_image').value.trim() || 'imagens/Logo.webp';

            const { error } = await db.from('events').insert([{
                title: document.getElementById('event_title').value.trim(),
                category: document.getElementById('event_category').value,
                event_date: document.getElementById('event_date').value,
                location: document.getElementById('event_location').value.trim(),
                description: document.getElementById('event_desc').value.trim(),
                image_url: foto,
                created_at: new Date().toISOString()
            }]);

            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Publicar Evento';

            if (error) {
                alert("Erro ao cadastrar evento: " + error.message);
            } else {
                alert("Evento publicado com sucesso!");
                document.getElementById('formEvento').reset();
                mostrarAba('list-evento');
            }
        });
        // Listar Eventos do Supabase
        async function carregarListaEventos() {
            const container = document.getElementById('lista-eventos-admin');
            container.innerHTML = '<p><i class="fa-solid fa-spinner fa-spin"></i> Carregando eventos...</p>';

            const { data: eventos, error } = await db.from('events').select('*').order('event_date', { ascending: true });

            if (error) {
                container.innerHTML = `<p style="color: #c0392b;">Erro ao carregar: ${error.message}</p>`;
                return;
            }

            if (!eventos || eventos.length === 0) {
                container.innerHTML = '<p style="color:#888;">Nenhum evento cadastrado ainda.</p>';
                return;
            }

            container.innerHTML = '';
            eventos.forEach(evt => {
                const evtId = evt.id;
                const inicio = evt.event_date ? evt.event_date.split('T')[0].split('-').reverse().join('/') : '';
                const fim = evt.end_date ? evt.end_date.split('T')[0].split('-').reverse().join('/') : '';
                const periodo = (fim && fim !== inicio) ? `De ${inicio} até ${fim}` : inicio;

                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 14px;">
                        <img src="${evt.image_url || 'imagens/Logo.webp'}" class="item-thumb" alt="Evento" onerror="this.src='imagens/Logo.webp'">
                        <div>
                            <h4 style="margin: 0; color: var(--primary);">${evt.title}</h4>
                            <p style="margin: 2px 0; font-size: 0.85rem; color: #555;">
                                ${evt.category} • ${periodo} • ${evt.location}
                            </p>
                        </div>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button class="btn-delete" onclick="excluirEvento('${evtId}', '${evt.title}')">
                            <i class="fa-solid fa-trash"></i> Excluir
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function excluirEvento(id, titulo) {
            if (!confirm(`Deseja excluir o evento "${titulo}"?`)) return;
            const { error } = await db.from('events').delete().eq('id', id);
            if (error) alert("Erro ao excluir: " + error.message);
            else {
                alert("Evento excluído com sucesso!");
                carregarListaEventos();
            }
        }
    </script>
</body>

</html>
